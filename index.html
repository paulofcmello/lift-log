<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>Lift Log</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#1C1B19; --muted:#66625B; --line:#E7E3DB;
  --accent:#D9701E; --accent-soft:#F4CFAE; --idle:#E2DED5; --head:#D3CEC4; --ok:#2F7D4F;
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);
  --r:16px; --shadow:0 6px 20px -8px rgba(60,45,25,.18);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{isolation:isolate;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(170px + env(safe-area-inset-bottom))}
header .date{color:var(--muted);font-size:14px;font-weight:600}
header h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.chip b{color:var(--ink);font-weight:700;margin-right:4px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip[aria-pressed=true] b{color:var(--accent-soft)}
section{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:16px}
.map{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;align-items:center}
.map figure{text-align:center}
.map svg{width:100%;height:auto;max-height:260px}
.map figcaption{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.map ul{grid-column:1/-1;list-style:none;padding:12px 0 0;border-top:1px solid var(--line);font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px 16px}
.map li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.m{fill:var(--idle);stroke:var(--surface);stroke-width:.5;transition:fill .3s cubic-bezier(.16,1,.3,1)}
.m.l1{fill:var(--accent-soft)} .m.l2{fill:var(--accent)}
.headc{fill:var(--head);stroke:var(--surface);stroke-width:.5}
.list h2,.hist h2{font-size:13px;font-weight:700;color:var(--muted);padding:16px 16px 4px}
.ex{border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exhead{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.exhead .t{flex:1;min-width:0}
.exhead .n{font-weight:700;font-size:16px}
.exhead .s{font-size:13px;color:var(--muted);margin-top:2px}
.count{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.count.done{color:var(--ok)}
.chev{transition:transform .25s cubic-bezier(.16,1,.3,1);color:var(--muted)}
.ex.open .chev{transform:rotate(90deg)}
.sets{padding:0 16px 14px;display:none}
.ex.open .sets{display:block}
.last{font-size:13px;color:var(--muted);margin-bottom:10px}
.last b{color:var(--ink)}
.row{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.row .i{font-size:13px;font-weight:700;color:var(--muted)}
.field{position:relative}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 34px 0 12px;font-size:16px;font-weight:700;background:var(--bg)}
.field input::placeholder{color:#9A958C;font-weight:600}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:600;pointer-events:none}
.tick{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tick[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.row.done input{border-color:transparent;background:#EAF3ED}
.addset{font-size:14px;font-weight:700;color:var(--accent);padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.run{padding:16px;display:grid;gap:12px}
.run .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run label{font-size:13px;font-weight:700;color:var(--muted);display:grid;gap:6px}
.pace{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px}
.pace strong{font-size:28px;font-weight:800;letter-spacing:-.02em}
.finish{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:398px;height:54px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
.finish:disabled{background:#B9B4AA;box-shadow:none;cursor:not-allowed}
/* liquid-glass recipe: colorless 6% tint, three-inset rim, hairline border, blur(3px) fallback; refraction added by JS on Chromium */
.glass{border:1px solid rgba(30,33,45,.12);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(179,179,179,.06));
  box-shadow:0 10px 30px rgba(30,33,45,.12),inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(3px) saturate(125%);backdrop-filter:blur(3px) saturate(125%)}
/* segmented glass control: a lens marks the selected item and follows the finger while dragging */
.seg{position:relative;scale:1;transition:scale .55s var(--spring);display:flex;gap:4px;padding:5px;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none}
.seg button{position:relative;z-index:1;display:grid;place-items:center;border-radius:999px;color:var(--muted);transition:color .3s cubic-bezier(.16,1,.3,1),scale .5s var(--spring);-webkit-tap-highlight-color:transparent}
.seg button[aria-current=page]{color:var(--ink)}
.seg button.hover{scale:1.08}
.lens{position:absolute;top:5px;left:0;width:0;height:0;border-radius:999px;pointer-events:none;background:rgba(28,27,25,.07);
  transition:translate .55s var(--spring),width .55s var(--spring),scale .55s var(--spring),background .3s,box-shadow .3s}
.seg.pressing .lens{scale:1.18;background:rgba(255,255,255,.45);
  box-shadow:0 6px 18px -6px rgba(40,30,15,.3),inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.5)}
.seg.dragging .lens{transition:scale .55s var(--spring),background .3s,box-shadow .3s}
nav{position:fixed!important;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom))}
nav.pressing{scale:1.06}
nav button{width:76px;height:50px}
nav button svg{transition:scale .5s var(--spring)}
nav button[aria-current=page]{color:var(--accent)}
nav button[aria-current=page] svg{animation:pop .6s var(--spring)}
.days{margin-top:16px}
.days.pressing{scale:1.03}
.days button{flex:1;height:42px;font-size:14px;font-weight:600;white-space:nowrap}
.days button b{font-weight:800;margin-right:3px;color:var(--muted);transition:color .3s}
.days button[aria-current=page]{font-weight:700}
.days button[aria-current=page] b{color:var(--accent)}
@keyframes pop{from{scale:.6}to{scale:1}}
.chip,.tick,.addset,.finish,.exhead{transition:scale .45s var(--spring);-webkit-tap-highlight-color:transparent}
.chip:active,.tick:active,.addset:active,.finish:not(:disabled):active{scale:.93}
.exhead:active{scale:.985}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(28rem 22rem at 15% 92%,rgba(217,112,30,.16),transparent 60%),
  radial-gradient(24rem 20rem at 90% 80%,rgba(244,207,174,.45),transparent 62%),
  radial-gradient(30rem 24rem at 80% 5%,rgba(244,207,174,.35),transparent 60%)}
.hist .day{padding:14px 16px;border-top:1px solid var(--line)}
.hist .day:first-of-type{border-top:0}
.hist .dh{display:flex;justify-content:space-between;font-weight:700}
.hist .dh span{color:var(--muted);font-size:13px}
.hist p{font-size:14px;color:var(--muted);margin-top:4px}
.hist p b{color:var(--ink);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
// Plan: [id, name, sets, reps, muscles]. Edit here to change the program.
const PLAN = [
  {id:'push', label:'Push', name:'Push + Delts', ex:[
    ['latraise','DB lateral raise',3,12,['deltSide']],
    ['shpress','Shoulder press',3,12,['deltFront','deltSide','triceps']],
    ['incline','Incline DB press',3,12,['chestUpper','deltFront','triceps']],
    ['ohtri','Overhead triceps extension',3,12,['triceps']],
    ['cablecrunch','Cable crunch',2,12,['abs']]]},
  {id:'pull', label:'Pull', name:'Pull + Biceps', ex:[
    ['pulldown','Lat pulldown',2,12,['lats','biceps','upperBack']],
    ['cablerow','Seated cable row',2,12,['upperBack','lats','deltRear','biceps']],
    ['reardelt','Cable rear delt fly',2,12,['deltRear','upperBack']],
    ['inclcurl','Incline DB curl',2,12,['biceps']],
    ['wristcurl','Seated DB wrist curl',2,15,['forearms']]]},
  {id:'run1', label:'Run', name:'Run', run:true},
  {id:'arms', label:'Arms', name:'Arms', ex:[
    ['dbcurl','DB curl',2,12,['biceps','forearms']],
    ['inclcurl','Incline DB curl',2,12,['biceps']],
    ['ohtri','Overhead triceps extension',3,12,['triceps']],
    ['revcurl','Reverse curl',2,15,['forearms','biceps']],
    ['wristcurl','Seated DB wrist curl',2,15,['forearms']],
    ['cablecrunch','Cable crunch',2,12,['abs']]]},
  {id:'run2', label:'Run', name:'Run', run:true},
];
const RUN_MUSCLES = ['quads','hams','glutes','calves'];
const MUSCLE_NAMES = {deltSide:'Side delts',deltFront:'Front delts',deltRear:'Rear delts',chestUpper:'Upper chest',chest:'Chest',abs:'Abs',
  biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',lats:'Lats',upperBack:'Upper back',traps:'Traps',lowerBack:'Lower back',
  glutes:'Glutes',quads:'Quads',hams:'Hamstrings',calves:'Calves',shins:'Shins'};

// ---- storage (per-browser; shortcut: localStorage only, move to a backend if you want sync across devices)
const KEY='liftlog.v1';
let db; try{ db=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
db = db || {sessions:[], drafts:{}};
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(db)) }catch(e){ toast('Could not save on this device') } };
const SEED=[{id:'seed-2026-11-10-pull',t:new Date(2026,10,10,14,43).getTime(),day:'pull',gym:'Hélio',sets:{
  pulldown:[{w:52.5,r:10},{w:52.5,r:8,note:'8-9'}],
  cablerow:[{w:45,r:15,note:'15-16, falha, dá pra subir meio'}],
  reardelt:[{r:15,note:'1 peso, umas 15, falha'}],
  inclcurl:[{w:8,r:13,note:'última série, falha · inclinação 3 (meio)'}],
  cablecrunch:[{w:18.75,r:20,note:'15 + 3.75, umas 20'}]}},
  {id:'seed-2026-11-12-arms',t:new Date(2026,10,12,12,19).getTime(),day:'arms',gym:'Hélio',sets:{
  dbcurl:[{w:8,r:12},{w:8,r:12,note:'falha'}],
  inclcurl:[{w:7,r:10},{w:7,r:12,note:'falha'}],
  ohtri:[{w:10,r:13},{w:10,r:10}],
  revcurl:[{w:5,r:20}],
  wristcurl:[{w:7,note:'reps não anotadas'}]}},
  {id:'seed-2026-11-16-push',t:new Date(2026,10,16,11,41).getTime(),day:'push',gym:'Hélio',sets:{
  latraise:[{w:7,note:'reps não anotadas'}],
  shpress:[{w:9,r:15},{w:9,r:14,note:'14-15, falha'}],
  incline:[{w:10,r:13,note:'13-14, falha'}],
  ohtri:[{w:10,r:12}],
  cablecrunch:[{w:26.25,r:20,note:'22.5 + 3.75, umas 20, pouco menos'}]}}];
{ const ids=new Set(SEED.map(x=>x.id)); db.sessions=db.sessions.filter(s=>!ids.has(s.id)).concat(SEED).sort((a,b)=>a.t-b.t); save() }

const lastSession = db.sessions[db.sessions.length-1];
let cur = lastSession ? (PLAN.findIndex(d=>d.id===lastSession.day)+1) % PLAN.length : 0;
let view='today', open=null;

// ---- helpers
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pace(km,min){ if(!(km>0&&min>0)) return '–'; const p=min/km, m=Math.floor(p), s=Math.round((p-m)*60); return s===60?`${m+1}:00`:`${m}:${String(s).padStart(2,'0')}` }
function lastFor(exId){ for(let i=db.sessions.length-1;i>=0;i--){ const s=db.sessions[i].sets?.[exId]; if(s&&s.length) return s } return null }
function draft(){ const d=PLAN[cur]; if(!db.drafts[d.id]){
  db.drafts[d.id] = d.run ? {km:'',min:''} : Object.fromEntries(d.ex.map(([id,,n])=>[id,Array.from({length:n},()=>({w:'',r:'',done:false}))])) }
  return db.drafts[d.id] }
function muscleLevels(d){ const lv={}; (d.run?RUN_MUSCLES.map(m=>[m]):d.ex.map(e=>e[4])).forEach(ms=>ms.forEach(m=>lv[m]=(lv[m]||0)+1)); return lv }
const fmtSet=x=>`${[x.w!=null&&`${x.w} kg`,x.r&&`${x.r} reps`].filter(Boolean).join(' × ')}${x.note?` (${esc(x.note)})`:''}`;
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});

// ---- icons (authored, 1.8 stroke)
const I={
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  today:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>',
  hist:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
};

// our muscle ids -> the polygon groups that show them
const REGIONS = {deltSide:['front-deltoids','back-deltoids'],deltFront:['front-deltoids'],deltRear:['back-deltoids'],chestUpper:['chest'],chest:['chest'],
  abs:['abs','obliques'],biceps:['biceps'],triceps:['triceps'],forearms:['forearm'],lats:['upper-back'],upperBack:['trapezius','upper-back'],
  lowerBack:['lower-back'],glutes:['gluteal'],quads:['quadriceps'],hams:['hamstring'],calves:['calves','left-soleus','right-soleus']};
const BASE = new Set(['head','neck','knees']);
function body(side, lv){
  const g={}; Object.entries(lv).forEach(([id,n])=>(REGIONS[id]||[]).forEach(r=>g[r]=Math.max(g[r]||0,n)));
  return BODY[side].map(([r,polys])=>polys.map(p=>`<polygon points="${p}" class="${BASE.has(r)?'headc':`m ${g[r]>=2?'l2':g[r]?'l1':''}`}"/>`).join('')).join('');
}

// ---- views
function today(){
  const d=PLAN[cur], dr=draft(), lv=muscleLevels(d);
  const targeted=Object.entries(lv).sort((a,b)=>b[1]-a[1]);
  let html=`<header><p class="date">${fmtDate(Date.now())}</p><h1>${esc(d.name)}</h1></header>
  <section class="map" aria-label="Muscles worked">
    <figure><svg viewBox="0 0 100 220" aria-label="Front">${body('front',lv)}</svg><figcaption>Front</figcaption></figure>
    <figure><svg viewBox="0 0 100 220" aria-label="Back">${body('back',lv)}</svg><figcaption>Back</figcaption></figure>
    <ul>${targeted.map(([k,v])=>`<li><span class="dot" style="background:var(${v>=2?'--accent':'--accent-soft'})"></span>${MUSCLE_NAMES[k]}</li>`).join('')}</ul>
  </section>`;
  if(d.run){
    const last=[...db.sessions].reverse().find(s=>s.run);
    html+=`<section class="run"><div class="grid">
      <label>Distance<div class="field"><input inputmode="decimal" data-run="km" value="${esc(dr.km)}" placeholder="${last?last.run.km:'5'}"><span>km</span></div></label>
      <label>Time<div class="field"><input inputmode="decimal" data-run="min" value="${esc(dr.min)}" placeholder="${last?last.run.min:'30'}"><span>min</span></div></label></div>
      <div class="pace"><span class="last">${last?`Last run: <b>${last.run.km} km</b> at ${pace(last.run.km,last.run.min)} /km`:'First run logged here'}</span><strong id="pace">${pace(+dr.km,+dr.min)}<small style="font-size:14px;color:var(--muted)"> /km</small></strong></div></section>`;
  } else {
    html+=`<section class="list"><h2>${d.ex.length} exercises</h2>${d.ex.map(([id,name,n,reps,ms])=>{
      const sets=dr[id], done=sets.filter(s=>s.done).length, last=lastFor(id);
      return `<div class="ex ${open===id?'open':''}" data-ex="${id}">
        <button class="exhead" data-toggle="${id}" aria-expanded="${open===id}"><div class="t"><div class="n">${esc(name)}</div><div class="s">${n} × ${reps} · ${ms.map(x=>MUSCLE_NAMES[x]).join(', ')}</div></div>
        <span class="count ${done>=sets.length?'done':''}">${done}/${sets.length}</span>${I.chev}</button>
        <div class="sets"><p class="last">${last?`Last time: <b>${last.map(fmtSet).join(', ')}</b>`:'No history yet. Log your first sets.'}</p>
        ${sets.map((s,k)=>{const ph=last?.[k]||last?.[last.length-1];return `<div class="row ${s.done?'done':''}"><span class="i">Set ${k+1}</span>
          <div class="field"><input inputmode="decimal" aria-label="Set ${k+1} weight" data-set="${id}:${k}:w" value="${esc(s.w)}" placeholder="${ph?.w??'kg'}"><span>kg</span></div>
          <div class="field"><input inputmode="numeric" aria-label="Set ${k+1} reps" data-set="${id}:${k}:r" value="${esc(s.r)}" placeholder="${ph?.r||reps}"><span>reps</span></div>
          <button class="tick" data-tick="${id}:${k}" aria-pressed="${s.done}" aria-label="Mark set ${k+1} done">${I.check}</button></div>`}).join('')}
        <button class="addset" data-add="${id}">${I.plus} Add set</button></div></div>`}).join('')}</section>`;
  }
  const can = d.run ? (+dr.km>0&&+dr.min>0) : Object.values(dr).some(s=>s.some(x=>x.done));
  return html+`<button class="finish" data-finish ${can?'':'disabled'}>Finish workout</button>`;
}

function history(){
  const ss=[...db.sessions].reverse();
  const name=id=>Object.fromEntries(PLAN.flatMap(d=>d.ex||[]).map(e=>[e[0],e[1]]))[id]||id;
  return `<header><p class="date">${ss.length} workouts logged</p><h1>History</h1></header>
  <section class="hist">${ss.length?ss.map(s=>`<div class="day"><div class="dh">${esc(PLAN.find(p=>p.id===s.day)?.name||s.day)}<span>${s.gym?esc(s.gym)+' · ':''}${fmtDate(s.t)}</span></div>
    ${s.run?`<p><b>${s.run.km} km</b> in ${s.run.min} min · ${pace(s.run.km,s.run.min)} /km</p>`
      :Object.entries(s.sets).map(([id,sets])=>`<p><b>${esc(name(id))}</b> ${sets.map(fmtSet).join(', ')}</p>`).join('')}</div>`).join('')
    :'<p class="empty">No workouts yet. Finish one on Today and it shows up here.</p>'}</section>`;
}

const $nav=document.createElement('nav'); $nav.className='seg glass'; $nav.setAttribute('aria-label','Sections');
$nav.innerHTML=`<button data-view="today" aria-label="Today">${I.today}</button><button data-view="history" aria-label="History">${I.hist}</button>`;
document.body.appendChild($nav);
function glassTabs(el,isActive,onPick){
  const lens=document.createElement('span'); lens.className='lens'; el.prepend(lens);
  const tabs=[...el.querySelectorAll('button')];
  const place=(x,b)=>{ lens.style.translate=`${x}px 0`; lens.style.width=b.offsetWidth+'px'; lens.style.height=b.offsetHeight+'px' };
  const hover=i=>tabs.forEach((b,k)=>b.classList.toggle('hover',k===i));
  let drag=null;
  el.addEventListener('pointerdown',e=>{
    try{ el.setPointerCapture(e.pointerId) }catch(_){} let i=tabs.findIndex(b=>b.contains(e.target)); if(i<0) i=tabs.findIndex(isActive);
    drag={i}; el.classList.add('pressing'); place(tabs[i].offsetLeft,tabs[i]); hover(i);
  });
  el.addEventListener('pointermove',e=>{
    if(!drag) return;
    const r=el.getBoundingClientRect(), k=el.offsetWidth/r.width, w=tabs[0].offsetWidth;
    const min=tabs[0].offsetLeft, max=tabs.at(-1).offsetLeft, x=Math.min(max,Math.max(min,(e.clientX-r.left)*k-w/2));
    el.classList.add('dragging'); drag.i=Math.round((x-min)/((max-min)/(tabs.length-1)||1)); place(x,tabs[drag.i]); hover(drag.i);
  });
  const end=commit=>()=>{ if(!drag) return; const i=drag.i; drag=null; el.classList.remove('pressing','dragging'); hover(-1); commit?onPick(i):render() };
  el.addEventListener('pointerup',end(true));
  el.addEventListener('pointercancel',end(false));
  el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&e.detail===0) onPick(tabs.indexOf(b)) }); // keyboard
  return ()=>{ tabs.forEach(b=>b.setAttribute('aria-current',isActive(b)?'page':'false')); const a=tabs.find(isActive); if(a) place(a.offsetLeft,a) };
}
const syncNav=glassTabs($nav,b=>b.dataset.view===view,i=>{ const v=['today','history'][i]; if(v!==view){ view=v; scrollTo(0,0) } render() });
// day picker lives outside the re-rendered markup so its lens can glide between days
const $days=document.createElement('div'); $days.className='seg glass days'; $days.setAttribute('role','group'); $days.setAttribute('aria-label','Plan day');
$days.innerHTML=PLAN.map((p,i)=>`<button data-d="${i}" aria-label="Day ${i+1}, ${p.name}"><span><b>${i+1}</b>${p.label}</span></button>`).join('');
const syncDays=glassTabs($days,b=>+b.dataset.d===cur,i=>{ cur=i; open=null; render() });

// Liquid-glass refraction, vanilla port of the liquid-glass skill's directive.
// Field formulas from dashersw/liquid-glass-js (MIT, (c) 2025 Armagan Amcalar).
// Chromium only: Safari parses url() backdrop filters but paints nothing, so it keeps the CSS blur fallback.
function liquidGlass(el,id){
  const chromium = navigator.userAgentData?.brands?.some(b=>/Chrom|Edge/.test(b.brand)) || /Chrome\//.test(navigator.userAgent);
  if(!chromium) return;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',0); svg.setAttribute('height',0); svg.style.position='absolute';
  document.body.appendChild(svg);
  const build=()=>{
    const {width:w,height:h}=el.getBoundingClientRect(); if(!w||!h) return;
    const r=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||0,Math.min(w,h)/2);
    const pw=innerWidth, ph=innerHeight, S=2, W=Math.round(w*S), H=Math.round(h*S), m=Math.min(w,h);
    const dx=new Float32Array(W*H), dy=new Float32Array(W*H); let max=0;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const px=(x+.5)/S, py=(y+.5)/S, cx=px/w, cy=py/h;
      const tx=Math.abs(px-w/2)-(w/2-r), ty=Math.abs(py-h/2)-(h/2-r);
      const d=Math.max(-(Math.hypot(Math.max(tx,0),Math.max(ty,0))+Math.min(Math.max(tx,ty),0)-r),0);
      const rim=Math.exp(-d*1.7), total=Math.exp(-d*.5)*.015+rim*.028;
      let nx=cx-.5, ny=cy-.5; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l;
      const corner=Math.exp(-(Math.max(Math.min(cx,1-cx),Math.min(cy,1-cy))*m)*.3)*.06;
      const ripple=Math.sin(d/m*25)*.26*rim, i=y*W+x;
      dx[i]=(nx*(total+corner)-ny*ripple)*pw; dy[i]=(ny*(total+corner)+nx*ripple)*ph;
      max=Math.max(max,Math.abs(dx[i]),Math.abs(dy[i]));
    }
    const scale=Math.max(max*2,1e-4), bias=scale*(128/255-.5), c=document.createElement('canvas'); c.width=W; c.height=H;
    const ctx=c.getContext('2d'), img=ctx.createImageData(W,H), b=v=>Math.max(0,Math.min(255,Math.round(v)));
    for(let i=0;i<W*H;i++){ img.data.set([b(255*(.5+(dx[i]-bias)/scale)),b(255*(.5+(dy[i]-bias)/scale)),128,255],i*4) }
    ctx.putImageData(img,0,0);
    const blur=2*.35, mg=scale/2+3*blur;
    svg.innerHTML=`<defs><filter id="${id}" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB" x="${-mg}" y="${-mg}" width="${w+2*mg}" height="${h+2*mg}">
      <feImage href="${c.toDataURL()}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="${blur}"/></filter></defs>`;
    el.style.backdropFilter=el.style.webkitBackdropFilter=`url(#${id})`;
  };
  let raf, t; const queue=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(build) };
  new ResizeObserver(queue).observe(el);
  addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(queue,180) });
}
liquidGlass($nav,'lg-nav'); liquidGlass($days,'lg-days');

function render(){
  $app.innerHTML = view==='today'?today():history();
  if(view==='today') $app.querySelector('header').after($days);
  syncNav(); syncDays();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800) }

// ---- events
$app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const ds=b.dataset;
  if(ds.day){ cur=+ds.day; open=null }
  else if(ds.toggle){ open = open===ds.toggle?null:ds.toggle }
  else if(ds.add){ const s=draft()[ds.add]; s.push({w:s.at(-1)?.w||'',r:'',done:false}); save() }
  else if(ds.tick){
    const [id,k]=ds.tick.split(':'), s=draft()[id][k], row=b.closest('.row');
    if(!s.done){ // empty fields take the placeholder (last time / plan) so tapping ✓ is enough when nothing changed
      const [w,r]=row.querySelectorAll('input'); s.w=s.w||w.placeholder; s.r=s.r||r.placeholder;
      if(!(+s.w>=0&&+s.r>0)){ toast('Enter weight and reps first'); return }
    }
    s.done=!s.done; save();
  }
  else if('finish' in ds){
    const d=PLAN[cur], dr=draft(), sess={t:Date.now(), day:d.id};
    if(d.run) sess.run={km:+dr.km, min:+dr.min};
    else sess.sets=Object.fromEntries(Object.entries(dr).map(([id,s])=>[id,s.filter(x=>x.done).map(x=>({w:+x.w,r:+x.r}))]).filter(([,s])=>s.length));
    db.sessions.push(sess); delete db.drafts[d.id]; save();
    cur=(cur+1)%PLAN.length; open=null; toast(`${d.name} saved`);
  }
  else return;
  render();
});
$app.addEventListener('input',e=>{
  const el=e.target, dr=draft();
  if(el.dataset.set){ const [id,k,f]=el.dataset.set.split(':'); dr[id][k][f]=el.value }
  else if(el.dataset.run){ dr[el.dataset.run]=el.value; document.getElementById('pace').firstChild.textContent=pace(+dr.km,+dr.min) }
  save();
  const btn=$app.querySelector('[data-finish]');
  if(btn&&PLAN[cur].run) btn.disabled=!(+dr.km>0&&+dr.min>0);
});
